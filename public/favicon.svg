<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Bright Yellow Sunshine Circular Badge Background -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="#FFE01B" stroke="#000000" stroke-width="3.5" />
  
  <!-- Playful decorative dots/sparkles -->
  <circle cx="12" cy="12" r="2.5" fill="#FF4D4D" stroke="#000000" stroke-width="1.5" />
  <circle cx="52" cy="12" r="2" fill="#00D26A" stroke="#000000" stroke-width="1.5" />
  <path d="M50 48L53 52L57 50L54 55L57 59L52 57L49 61L48 56L43 56L47 52L44 48L49 50Z" fill="#FF4D4D" opacity="0.3"/>

  <!-- Cute Colorful Open Book Mascot -->
  <g transform="translate(6, 12)">
    <!-- Book Backing Shadow -->
    <path d="M4 34C14 30 26 31 26 33C26 31 38 30 48 34V10C38 6 26 7 26 9C26 7 14 6 4 10V34Z" fill="#000000" />
    
    <!-- Colorful Book Cover (Vibrant Blue/Cyan) -->
    <path d="M2 32C12 28 24 29 24 31C24 29 36 28 46 32V8C36 4 24 5 24 7C24 5 12 4 2 8V32Z" fill="#3B82F6" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- White Pages Inside -->
    <path d="M5 29C13 25.5 23 26.5 24 28V8C23 6.5 13 5.5 5 9V29Z" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M43 29C35 25.5 25 26.5 24 28V8C25 6.5 35 5.5 43 9V29Z" fill="#FFFBEB" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Polish Red Ribbon / Bookmark hanging down -->
    <path d="M22 6V36L24.5 33.5L27 36V6H22Z" fill="#EF4444" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" />

    <!-- Cute Smiling Eyes & Cheeks on Book -->
    <!-- Left Eye (Happy wink / sparkle) -->
    <circle cx="14" cy="17" r="2.5" fill="#000000" />
    <circle cx="13" cy="16" r="0.9" fill="#FFFFFF" />
    <ellipse cx="9" cy="21" rx="2.5" ry="1.5" fill="#FF85A1" />

    <!-- Right Eye (Happy eye) -->
    <circle cx="34" cy="17" r="2.5" fill="#000000" />
    <circle cx="33" cy="16" r="0.9" fill="#FFFFFF" />
    <ellipse cx="39" cy="21" rx="2.5" ry="1.5" fill="#FF85A1" />

    <!-- Smiling Mouth -->
    <path d="M21 21Q24 25 27 21" stroke="#000000" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Tiny Number '2' Badge / Star on top corner -->
    <g transform="translate(32, -4)">
      <polygon points="9,0 12,6 18,7 13,11 15,18 9,14 3,18 5,11 0,7 6,6" fill="#FF3366" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
      <text x="9" y="12" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="8" fill="#FFFFFF" text-anchor="middle">2</text>
    </g>
  </g>

  <!-- Cheerful Little Pencil sticking out friendly on the bottom-right -->
  <g transform="translate(36, 36) rotate(-25)">
    <!-- Pencil Body -->
    <rect x="0" y="0" width="8" height="18" rx="2" fill="#FF9F1C" stroke="#000000" stroke-width="2" />
    <!-- Pencil stripes -->
    <line x1="3" y1="0" x2="3" y2="18" stroke="#000000" stroke-width="1" />
    <line x1="5.5" y1="0" x2="5.5" y2="18" stroke="#000000" stroke-width="1" />
    <!-- Pencil Eraser (Pink) & Metal Band -->
    <rect x="0" y="0" width="8" height="4" fill="#FF6584" stroke="#000000" stroke-width="2" />
    <rect x="0" y="4" width="8" height="2" fill="#E2E8F0" stroke="#000000" stroke-width="1.5" />
    <!-- Pencil Tip (Wood + Graphite) -->
    <polygon points="0,18 8,18 4,25" fill="#FDE68A" stroke="#000000" stroke-width="2" stroke-linejoin="round" />
    <polygon points="2.5,22 5.5,22 4,25" fill="#000000" />
  </g>
</svg>
