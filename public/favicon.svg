<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Soft drop shadow / 3D block base -->
  <rect x="6" y="10" width="88" height="84" rx="26" fill="#1E1B4B" />
  
  <!-- Outer bright badge (Sunny Warm Gradient / Border) -->
  <rect x="6" y="6" width="88" height="84" rx="26" fill="#FFD000" stroke="#1E1B4B" stroke-width="6" />

  <!-- Playful polish dots / sparkles -->
  <circle cx="20" cy="20" r="4" fill="#EF4444" stroke="#1E1B4B" stroke-width="2.5" />
  <circle cx="80" cy="22" r="3.5" fill="#10B981" stroke="#1E1B4B" stroke-width="2" />
  <polygon points="82,42 85,46 90,47 86,51 87,56 82,53 77,56 78,51 74,47 79,46" fill="#F59E0B" />

  <!-- Open friendly school book -->
  <g transform="translate(14, 22)">
    <!-- Book 3D Thickness -->
    <path d="M4 46 C20 40, 36 41, 36 44 C36 41, 52 40, 68 46 L68 18 C52 12, 36 13, 36 16 C36 13, 20 12, 4 18 Z" fill="#1E1B4B" />
    
    <!-- Left Cover / Page (Vibrant Blue) -->
    <path d="M4 42 C19 37, 34 38, 36 41 L36 13 C34 10, 19 9, 4 14 Z" fill="#3B82F6" stroke="#1E1B4B" stroke-width="4" stroke-linejoin="round" />
    <!-- Left Inner White Page -->
    <path d="M7 38 C20 34, 32 35, 34 37 L34 15 C32 12.5, 20 11.5, 7 15.5 Z" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="3" stroke-linejoin="round" />

    <!-- Right Cover / Page (Vibrant Pink/Cyan) -->
    <path d="M68 42 C53 37, 38 38, 36 41 L36 13 C38 10, 53 9, 68 14 Z" fill="#3B82F6" stroke="#1E1B4B" stroke-width="4" stroke-linejoin="round" />
    <!-- Right Inner White Page -->
    <path d="M65 38 C52 34, 40 35, 38 37 L38 15 C40 12.5, 52 11.5, 65 15.5 Z" fill="#FEF08A" stroke="#1E1B4B" stroke-width="3" stroke-linejoin="round" />

    <!-- Polish Red Ribbon Bookmark -->
    <path d="M33 9 L33 46 L36 43 L39 46 L39 9 Z" fill="#DC2626" stroke="#1E1B4B" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Cute Eyes on Book -->
    <circle cx="21" cy="25" r="3.5" fill="#1E1B4B" />
    <circle cx="19.5" cy="23.5" r="1.2" fill="#FFFFFF" />
    <ellipse cx="14" cy="30" rx="3.5" ry="2" fill="#FDA4AF" />

    <circle cx="51" cy="25" r="3.5" fill="#1E1B4B" />
    <circle cx="49.5" cy="23.5" r="1.2" fill="#FFFFFF" />
    <ellipse cx="58" cy="30" rx="3.5" ry="2" fill="#FDA4AF" />

    <!-- Smile -->
    <path d="M31 29 Q36 34 41 29" fill="none" stroke="#1E1B4B" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Big Red Star / Badge with Number 2 -->
  <g transform="translate(62, 52)">
    <!-- Star shadow -->
    <circle cx="14" cy="15" r="15" fill="#1E1B4B" />
    <!-- Star body -->
    <circle cx="14" cy="13" r="14" fill="#EF4444" stroke="#1E1B4B" stroke-width="3.5" />
    <!-- White Digit 2 -->
    <text x="14" y="21" font-family="'Comic Sans MS', Arial, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle">2</text>
  </g>

  <!-- Little Smiling Wooden Pencil in bottom left -->
  <g transform="translate(10, 56) rotate(-20)">
    <rect x="0" y="0" width="10" height="24" rx="2" fill="#F97316" stroke="#1E1B4B" stroke-width="3" />
    <rect x="0" y="0" width="10" height="6" fill="#F43F5E" stroke="#1E1B4B" stroke-width="2.5" />
    <polygon points="0,24 10,24 5,33" fill="#FDE68A" stroke="#1E1B4B" stroke-width="3" stroke-linejoin="round" />
    <polygon points="3,29 7,29 5,33" fill="#1E1B4B" />
  </g>
</svg>
